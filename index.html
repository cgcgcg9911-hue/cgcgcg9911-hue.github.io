<script>
const $=s=>document.querySelector(s);
const FIX=['النادي الرياضي','وسائل النقل','الجكاير','الإنترنت','طعام ومشروبات','فواتير'],VAR=['صحة ودواء','تسوق وملابس','ترفيه ومطاعم','هدايا ومناسبات','المكملات الغذائية','أخرى'],CATS=[...FIX,...VAR,'أقساط وسلفة'],CG=[['مصروفات ثابتة',FIX],['مصروفات متغيرة',VAR],['الالتزامات',['أقساط وسلفة']]];

 idb('get').then(x=>{try{const o=x&&JSON.parse(x);if(o&&Array.isArray(o.tx)&&!S.tx.length&&!S.debts.length&&!S.goals.length&&!S.fixed.length&&(o.tx.length||(o.debts||[]).length||(o.goals||[]).length||(o.fixed||[]).length)){S=Object.assign({tx:[],fixed:[],debts:[],goals:[],budgets:{},startDay:1,accs:[],loans:[],tr:[],auto:null,sv:[],borrows:[]},o);if(!S.accs.length)S.accs=defAccs();mig()}}catch(e){}
  const j=JSON.stringify(S);try{localStorage.setItem('masrofati',j)}catch(e){}return idb('set',j)}).then(r=>{idbOK=!!r;render()})}
const REN={'مواصلات ووقود':'وسائل النقل'};function mig(){if(!S.borrows)S.borrows=[];S.tx.forEach(t=>{if(REN[t.cat])t.cat=REN[t.cat]});S.fixed.forEach(t=>{if(REN[t.cat])t.cat=REN[t.cat]});for(const k in REN)if(S.budgets[k]!=null){S.budgets[REN[k]]=S.budgets[k];delete S.budgets[k]}}mig();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>Math.round(n).toLocaleString('en-US')+' د.ع';
const iso=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>iso();
function period(){const n=new Date(),d=Math.min(Math.max(+S.startDay||1,1),28);const s=new Date(n.getFullYear(),n.getMonth()+(n.getDate()>=d?0:-1),d);return[iso(s),iso(new Date(s.getFullYear(),s.getMonth()+1,d))]}
const inP=t=>{const[a,b]=period();return t.date>=a&&t.date<b};
function sheet(title,fields,ok,btn,danger){
 const h=fields.map(x=>`<label>${x.l}${x.o?`<select id="f_${x.k}">${(x.og?x.og.map(g=>`<optgroup label="${g[0]}">${g[1].map(o=>`<option ${o==x.v?'selected':''}>${esc(o)}</option>`).join('')}</optgroup>`):x.o.map(o=>`<option ${o==x.v?'selected':''}>${esc(o)}</option>`)).join('')}</select>`:x.t=='ta'?`<textarea id="f_${x.k}" rows="5">${esc(x.v)}</textarea>`:x.t=='number'&&!/يوم/.test(x.l)?`<div class="mi"><input id="f_${x.k}" type="text" inputmode="decimal" oninput="fmt(this)" value="${esc(+x.v?(+x.v).toLocaleString('en-US'):x.v)}"><span>د.ع</span></div>`:`<input id="f_${x.k}" type="${x.t||'text'}" ${x.t=='number'?'inputmode="decimal"':''} value="${esc(x.v)}">`}</label>`).join('');
 $('#sh').innerHTML=`<div class="bk" onclick="closeS()"></div><div class="sp"><h3>${title}</h3>${h}<button class="b" id="ok" ${danger?'style="background:var(--w)"':''}>${btn||'حفظ'}</button></div>`;
 $('#sh').className='on';
 $('#ok').onclick=()=>{const v={};fields.forEach(x=>v[x.k]=$('#f_'+x.k).value.trim());if(ok(v)!==false){closeS()}};
}
const fmt=el=>{const s=el.value.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d.]/g,''),[i,...r]=s.split('.');el.value=(i?(+i).toLocaleString('en-US'):'')+(r.length?'.'+r.join('').slice(0,2):'')};

const num=v=>Math.max(0,parseFloat(String(v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/,/g,''))||0);
function addExp(){setTimeout(()=>{const c=$('#f_c');if(c)c.onchange=()=>{$('#f_i').placeholder=c.value=='أخرى'?'اكتب ما اشتريته أو الخدمة التي دفعت لها':''}},0);sheet('إضافة مصروف',[{k:'i',l:'ما الذي اشتريته أو دفعت لأجله؟'},{k:'a',l:'المبلغ (د.ع)',t:'number'},{k:'c',l:'الفئة',o:CATS,og:CG,v:'طعام ومشروبات'},{k:'ac',l:'الحساب',o:accNames()},{k:'d',l:'التاريخ',t:'date',v:today()}],v=>{const a=num(v.a);if(!a||!v.d)return false;if(v.c=='أخرى'&&!v.i){$('#f_i').focus();return false}S.tx.push({id:uid(),type:'e',item:v.i||v.c,amt:a,cat:v.c,date:v.d,acc:accId(v.ac)})})}

function delTx(id){sheet('حذف هذه العملية؟',[],()=>{S.tx=S.tx.filter(t=>t.id!=id)},'حذف',1)}
const mdiff=(a,b)=>(+b.slice(0,4)*12+ +b.slice(5,7))-(+a.slice(0,4)*12+ +a.slice(5,7));
function due(){const t=today(),m=t.slice(0,7),dn=+t.slice(8),r=[];
 S.fixed.forEach(x=>{if(x.rep=='يومي'?x.last!=t:x.rep=='كل 3 أشهر'?(dn>=x.day&&(!x.last||mdiff(x.last,t)>=3)):(dn>=x.day&&(x.last||'').slice(0,7)!=m))r.push({k:'f',id:x.id,n:x.name,a:x.amt})});
 S.debts.forEach(x=>{if(x.paid<x.total&&x.mon>0&&dn>=x.day&&(x.last||'').slice(0,7)!=m)r.push({k:'d',id:x.id,n:x.name,a:Math.min(x.mon,x.total-x.paid)})});(S.borrows||[]).forEach(b=>{const q=b.amt-paid(b);if(q>0&&b.due&&b.due<=dl(t,3))r.push({k:'b',id:b.id,n:'دين: '+b.who+(b.due<t?' (متأخر)':''),a:q})});return r}

 if(k=='f'){const x=S.fixed.find(y=>y.id==id);x.last=t;if(!skip)S.tx.push({id:uid(),type:'e',item:x.name,amt:x.amt,cat:x.cat,date:t,acc:x.acc})}

function addFixed(id){const e=S.fixed.find(y=>y.id==id)||{};sheet(e.id?'تعديل مصروف ثابت':'مصروف ثابت',[{k:'n',l:'الاسم (مثال: اشتراك النادي)',v:e.name},{k:'a',l:'المبلغ (د.ع)',t:'number',v:e.amt},{k:'r',l:'التكرار',o:['يومي','شهري','كل 3 أشهر'],v:e.rep},{k:'d',l:'تاريخ الدفع',t:'date',v:e.pdate||e.last||today()},{k:'c',l:'الفئة',o:FIX,v:e.cat},{k:'ac',l:'من حساب',o:accNames(),v:e.acc?accNm(e.acc):undefined},{k:'p',l:'تسجيل هذه الدفعة في السجل؟',o:['نعم','لا'],v:e.id?'لا':'نعم'}],v=>{const a=num(v.a);if(!a||!v.n)return false;{if(!v.d)return false;const o={name:v.n,amt:a,rep:v.r,day:Math.min(28,+v.d.slice(8)||1),pdate:v.d,cat:v.c,acc:accId(v.ac)};if(v.d<=today())o.last=v.d;if(e.id)Object.assign(e,o);else S.fixed.push({id:uid(),...o});if(v.p=='نعم'&&v.d<=today())S.tx.push({id:uid(),type:'e',item:v.n,amt:a,cat:v.c,date:v.d,acc:accId(v.ac)})}})}

function payDebt(id){const x=S.debts.find(y=>y.id==id);sheet('تسديد دفعة: '+esc(x.name),[{k:'a',l:'المبلغ المدفوع هذه المرة (د.ع)',t:'number',v:Math.min(x.mon||x.total-x.paid,x.total-x.paid)},{k:'ac',l:'من حساب',o:accNames()},{k:'d',l:'تاريخ الدفع',t:'date',v:today()}],v=>{const a=Math.min(num(v.a),x.total-x.paid);if(!a||!v.d)return false;x.paid+=a;if(v.d>=(x.last||'')){x.last=v.d;x.pdate=v.d;x.day=Math.min(28,+v.d.slice(8)||1)}S.tx.push({id:uid(),type:'e',item:x.name,amt:a,cat:'أقساط وسلفة',date:v.d,acc:accId(v.ac),did:x.id})})}
